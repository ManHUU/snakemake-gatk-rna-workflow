# config/config.yaml

# USER: Update these paths to point to your data
fastq_dir: "data/GSE256519"      # used only by make_units.sh, not at runtime
output_dir: "results"
log_dir: "logs"

# Sample sheet (TSV: sample / unit / fq1 / fq2). The pipeline reads samples and
# FASTQ paths from here — it does NOT glob fastq_dir. Regenerate with:
#   bash workflow/scripts/make_units.sh <fastq_dir> <paired|single>
units: "config/units.tsv"

# Sequencing type: "paired" or "single"
# Paired-end  → name files  {sample}_1.fastq  and  {sample}_2.fastq
# Single-end  → name files  {sample}.fastq
sequencing_type: "paired"


# ── HPC / cluster tuning ────────────────────────────────────────────────────
# Wall-time cap (MINUTES) for the auto-escalating GATK rules. Those rules scale
# their requested runtime on retry (attempt 1 → 2 → 3); this caps the request so
# the third attempt can never exceed your SLURM partition's MaxTime, which would
# otherwise make SLURM reject the submission. Set it to your partition's MaxTime:
#   scontrol show partition <name> | grep MaxTime
# Default 7200 = 5 days (Snellius `genoa`). This is the ONLY per-site cluster
# value that lives in config; the account, partition, and scratch path are
# environment variables consumed by run.sh — see run.sh / README.
partition_max_runtime: 7200


# Reference files
reference:
  fasta: "resources/GRCh38.primary_assembly.genome.fa"
  gtf: "resources/gencode.v44.primary_assembly.annotation.gtf"
  dbsnp: "resources/Homo_sapiens_assembly38.dbsnp138.vcf"
  mills_indels: "resources/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
  star_index_dir: "resources/star_hg38_index"

# STAR genome-index settings (reviewer comment C-09)
star:
  # Splice-junction database overhang used when building the STAR index.
  # STAR recommends (max read length - 1); e.g. 149 for 2x150 bp reads.
  #
  # "auto" (the default) detects the read length from the first sample's FASTQ
  # (config/units.tsv) and uses (detected length - 1) automatically, so you
  # normally never touch this. The chosen value is logged when the index is
  # built. You may instead pin an explicit integer (e.g. 149 or 99); if it
  # disagrees with the detected read length the pipeline WARNS but still uses
  # your value. Changing the effective overhang requires rebuilding the index,
  # so point star_index_dir at a fresh directory when it changes.
  sjdb_overhang: auto
  # STAR --genomeSAindexNbases. Leave null to use STAR's default (14), correct
  # for the full human genome. STAR requires a SMALLER value for small/compact
  # references (~ min(14, log2(genomeLength)/2 - 1)); the smoke-test config sets
  # this explicitly for its miniature reference.
  genome_sa_index_nbases: null

# Chromosomes to include in analysis
chromosomes: ["chr1", "chr2", "chr3", "chr4", "chr5", "chr6", "chr7", "chr8", "chr9", "chr10",
              "chr11", "chr12", "chr13", "chr14", "chr15", "chr16", "chr17", "chr18", "chr19",
              "chr20", "chr21", "chr22", "chrX", "chrY"]

# Filters for VariantFiltration
# Type-specific hard filters – used by Rules 14a / 14b (filter_snps / filter_indels)
# Based on GATK best practices for RNA-seq variant calling.
# FS threshold is 30 (not WGS default 60) to account for RNA-seq strand bias.
variant_filters:
  snp:
    QD:             2.0     # Quality by Depth
    FS:            30.0     # Fisher Strand Bias
    MQ:            40.0     # RMS Mapping Quality
    MQRankSum:    -12.5     # Mapping Quality Rank Sum Test
    ReadPosRankSum: -8.0    # Read Position Rank Sum Test
    DP:            10       # Minimum read depth

  indel:
    QD:             2.0     # Quality by Depth
    FS:           200.0     # Fisher Strand Bias
    ReadPosRankSum: -20.0   # Read Position Rank Sum Test
    DP:            10       # Minimum read depth


# SnpEff annotation + CDS filter
# data_dir is populated by workflow/scripts/download_refs.sh
snpeff:
  genome:   "hg38"
  data_dir: "resources/snpeff_data"

# RNA editing filter – REDIportal known sites (hg38)
# bed file is built by workflow/scripts/download_refs.sh
# This is a CONSERVATIVE, position-based exclusion of known A-to-I editing
# sites: it does not compare the edited allele or strand, so genuine genomic
# variants at these positions may also be removed. Set enabled: false to keep
# them (the pre-selection VCF Final_PASS.vcf.gz is retained either way). Each
# run records before/after/removed counts to stats/rna_editing_filter_counts.tsv.
# (reviewer comments G-03 / C-10)
rna_editing:
  enabled: true
  rediportal_bed: "resources/editing_db/known_editing_hg38.bed"

# Cluster filter – flag and remove dense SNP clusters (RNA-seq alignment artefacts)
# GATK VariantFiltration flags a SNP when >= cluster_size SNPs fall within a
# window_size-bp window. It operates on the JOINT COHORT VCF, so SNPs carried by
# different individuals can contribute to one cluster; its effect therefore
# depends on cohort composition. Set enabled: false to keep clustered SNPs (the
# pre-selection VCF Final_PASS_noEdit.vcf.gz is retained either way). Each run
# records before/after/removed counts to stats/cluster_filter_counts.tsv.
# (reviewer comments G-03 / C-11)
cluster_filter:
  enabled: true
  window_size: 35   # bp window
  cluster_size: 3   # min SNPs in window to trigger the cluster flag

# Coding-region (CDS) selection – keep only variants with a coding consequence.
# This reflects the intended application (coding variants) and is NOT a quality
# judgement on non-coding variants. Set enabled: false to keep all annotated
# variants (coding + non-coding) in the final output. (reviewer comments G-03)
cds_filter:
  enabled: true

# Resources (Memory in GB, Threads)
resources:
  join_genotyping:
    memory: 64 # GB
    threads: 4
